	<div id="wrapper">

<main>
		<!-- end header -->

		<!-- inner header -->
		<inner-header pagename="Contact Us"></inner-header>
		<!-- end inner header -->

		<!-- content -->
		<section id="content">
			<div class="container">
				<div class="row">
					<div class="col-md-6">
						<div id="contact-done" style="display: none">
							<div class="alert alert-success">
								<button type="button" class="close" data-dismiss="alert">×</button>
								Your message has been sent. Thank you!
							</div>
						</div>
						<div class="contacts">
							<form id="contact-form" class="contact">
								<div class="form-group has-feedback">
									<label for="name">Name*</label>
									<input type="text" class="form-control" id="name" name="name" placeholder="Your name">
								</div>
								<div class="form-group has-feedback">
									<label for="email">Email*</label>
									<input type="email" class="form-control" id="email" name="email" placeholder="Your email">
								</div>
								<div class="form-group has-feedback">
									<label for="subject">Subject*</label>
									<select class="form-control" name="subject" id="subject">
										<option value="default">Choose a subject</option>
										<option value="General inquiry">General inquiry</option>
										<option value="Price and quotation">Price and quotation</option>
										<option value="Product inquiry">Product inquiry</option>
										<option value="Technical support">Technical support</option>
										<option value="Report a vulnerability">Report a vulnerability</option>
										<option value="others">Others</option>
									</select>
								</div>
								<div class="form-group has-feedback" id="other-subject"></div>
								<div class="form-group has-feedback">
									<label for="message">Message*</label>
									<textarea class="form-control" id="message" rows="6" name="message" placeholder="Your detailed message"></textarea>
								</div>
								<p class="form-privacy">We use your details to respond to you. See our <a href="/subpages/privacy-policy.html" target="_blank" rel="noopener">Privacy Policy</a>.</p>
								<input type="submit" value="Submit" id="contact-submit" class="submit btn btn-default">
							</form>
						</div>
					</div>

					<div class="col-md-6">
						<!-- Google Maps -->
