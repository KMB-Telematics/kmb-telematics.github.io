	<script>
		class BlogPost extends HTMLElement {
			connectedCallback() {
				var src = this.attributes.src.value;
				// get only the filename
				var name = src.replace(/^.*[\\\/]/, '');
				name = name.replace(/\.[^/.]+$/, '');
				var contentText = `
					<div class="col-md-6 md-margin-bottom-40">
						<div class="blog" id="` + name + `">
							<a href="/subpages/` + name + `.html">
								<div class="blog-cover" id="cover-` + name + `"></div>
							</a>
							<center><h2 class="card-heading"><a href="/subpages/` + name + `.html"><div class="blog-title" id="title-` + name + `"></div></a></h2></center>
						</div>
					</div>
				`;
				this.innerHTML = contentText;
			}
		}
		customElements.define('blog-post', BlogPost);
	</script>
	<script>
		var blogFunction = function (param) {
			$('.blog-cover#cover-' + param).load('/subpages/' + param + '.html #blog-img');
			$('.blog-title#title-' + param).load('/subpages/' + param + '.html #blog-header', function () {
				var $h = $(this);
				var text = $h.text();
				$h.text(text);
			});
		};
		blogFunction('kmb-product-counter-uas-radar');
		blogFunction('kmb-product-daa-radar');
	</script>
